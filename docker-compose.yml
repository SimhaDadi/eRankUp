version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: erankup-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: erankup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erankup-network

  # Document Database (Content/Logs)
  mongo:
    image: mongo:6.0
    container_name: erankup-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - erankup-network

  # Caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: erankup-redis
    ports:
      - "6379:6379"
    networks:
      - erankup-network

  # Event Streaming Platform (Kafka + Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: erankup-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - erankup-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: erankup-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - erankup-network

  # AI/Analytics dependencies can be added here (e.g., Spark master/worker)
  # For now, we'll keep it simple or add a placeholder for a Python service

  # Example Analytics Service (Placeholder)
  # analytics-service:
  #   build: ./analytics
  #   ...

networks:
  erankup-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
