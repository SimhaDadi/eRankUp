version: '3.8'

services:
  # ============ Infrastructure ============
  postgres:
    image: pgvector/pgvector:pg14
    container_name: erankup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-erankup_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-erankup_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erankup-network

  redis:
    image: redis:7-alpine
    container_name: erankup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erankup-network

  # ============ Application ============
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: erankup-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run migration:run:prod && if [ \"$SEED_ADMIN\" = 'true' ]; then node dist/backend/src/admin-seed.js 2>/dev/null || echo 'Admin seed skipped'; fi && node dist/backend/src/main"
    networks:
      - erankup-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: erankup-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - erankup-network

  # ============ Reverse Proxy ============
  nginx:
    image: nginx:alpine
    container_name: erankup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - erankup-network

  # ============ SSL Certificate Manager ============
  certbot:
    image: certbot/certbot
    container_name: erankup-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - erankup-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:


networks:
  erankup-network:
    driver: bridge
